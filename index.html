/* v7: phẳng, thẻ trắng bo 16, chip màu, xanh FE CREDIT làm màu nhấn, nền hero tối cho Thu tiền */
:root{

  --accent:#07843f;--on-accent:#ffffff;--brand:#07843f;--soft:#e4f4ea;--key:#3a3ab5;

  --good:#0d6a33;--good-bg:#dcf2e3;--info:#1a4fa3;--info-bg:#dde8f8;--bad:#a3241d;--bad-bg:#fbe1de;
  --hit:#c6ebd3;--hit-bar:#1f9a55;--on-hit:#0f172a;--warn-bg:#fbe3df;--amber:#8a4a00;--amber-bg:#fde7c8;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1016;--surface:#151a22;--surface2:#1f2631;--ink:#eef2f7;--muted:#a4afc0;--line:#2a3340;
  --accent:#4cd68a;--on-accent:#04210f;--brand:#0b6a38;--soft:#173326;--key:#9aa0ff;
  --btn:#f1f5f9;--on-btn:#0f172a;--hero:#1c2257;--mint:#15382a;--sh:0 1px 2px rgba(0,0,0,.4);
  --cof:#5a9cf0;--non:#f08a5a;--ntu:#3dc49a;--tot:#9aa0ff;
  --good:#7fd69b;--good-bg:#1d3d2a;--info:#8fbaf5;--info-bg:#1c3050;--bad:#f59a93;--bad-bg:#472421;
  --hit:#1e5a39;--hit-bar:#4cc36f;--on-hit:#eaf6ec;--warn-bg:#40231f;--amber:#f5b865;--amber-bg:#45300f;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1016;--surface:#151a22;--surface2:#1f2631;--ink:#eef2f7;--muted:#a4afc0;--line:#2a3340;
  --accent:#4cd68a;--on-accent:#04210f;--brand:#0b6a38;--soft:#173326;--key:#9aa0ff;
  --btn:#f1f5f9;--on-btn:#0f172a;--hero:#1c2257;--mint:#15382a;--sh:0 1px 2px rgba(0,0,0,.4);
  --cof:#5a9cf0;--non:#f08a5a;--ntu:#3dc49a;--tot:#9aa0ff;

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 104px;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
.top{display:flex;align-items:center;gap:10px;padding:4px 0 6px}
.top .tt{flex:1;min-width:0;display:grid;gap:3px;justify-items:start}
.top h1{font-size:21px;line-height:1.15;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.top h1 i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
.tsub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600}
.acts{display:flex;gap:6px;align-items:center}

.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-disabled=true]{opacity:.38}
.ib.sm{width:34px;height:34px;box-shadow:none}.ib.sm svg{width:17px;height:17px}
.av{width:40px;height:40px;border-radius:50%;border:0;background:var(--btn);color:var(--on-btn);font:700 17px var(--font);display:grid;place-items:center;padding:0}
.bellw{position:relative;display:inline-flex}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:#d62b1f;color:#fff;font:700 11px/18px var(--font);text-align:center;border:2px solid var(--bg)}

#histw .sheet{width:100%;max-width:560px;max-height:min(70vh,560px);display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.3)}

#histw ul{list-style:none;margin:0;padding:0;overflow:auto}
#histw li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:14px}
#histw li time{font:600 12px var(--mono);color:var(--muted);white-space:nowrap;padding-top:2px}
#histw li.new{background:var(--hit)}
#histw .empty{padding:18px 14px;color:var(--muted)}
.sy{font-size:12px;font-weight:650;padding:2px 10px;border-radius:99px;border:0;background:var(--surface2);color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center;min-height:24px}
.sy i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sy.ok{background:var(--good-bg);color:var(--good)}.sy.ok i{background:var(--hit-bar)}
.sy.busy i{background:var(--info)}.sy.err{background:var(--bad-bg);color:var(--bad)}.sy.err i{background:var(--bad)}.sy.off i{background:#c98a00}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 12px;min-height:44px;font-weight:600}
.btn.pri{background:var(--btn);color:var(--on-btn);border-color:transparent;font-weight:700}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,.nav a:focus-visible,.ib:focus-visible,.sy:focus-visible,.av:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sec{margin:14px 0 0}

.card{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--sh);border:1px solid var(--line)}
.k{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.cond{display:grid;gap:10px}
.banner{border-radius:16px;padding:12px 14px;line-height:1.35;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh);display:grid;gap:6px}
.banner b{font-size:15px}
.banner small{font-weight:500;font-size:13px;color:var(--muted)}
.banner small.k{font-weight:700;font-size:11px}
.banner .bh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.banner.l2{border-color:var(--hit-bar)}.banner.l2 b{color:var(--good)}
.banner.l0{border-color:var(--bad)}.banner.l0 b{color:var(--bad)}
.pg{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.pg i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.pg.r i{background:var(--bad)}
.hero2{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.net{background:var(--accent);color:var(--on-accent);border-radius:14px;padding:8px 11px;text-align:right;min-width:0}
.net small{display:block;font-size:11px;opacity:.92}
.net b{display:block;font:700 15px var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero b{font:700 36px/1.1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--key)}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--good)}
.stat{font-size:11.5px;letter-spacing:.04em;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.stat.ok{background:var(--good-bg);color:var(--good)}
.stat.warn{background:var(--bad-bg);color:var(--bad)}
.stat.low{background:var(--amber-bg);color:var(--amber)}
.bars{display:grid;gap:13px;margin-top:14px}
.bl{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px}
.bl b{font:700 14px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tr{position:relative;height:10px;background:var(--surface2);border-radius:99px}
.tr i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.tr u{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--ink);text-decoration:none;opacity:.6}
.tr u.nx{border-left-color:var(--tot);opacity:1}
.slogan{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:16px;background:var(--soft);color:var(--good);font-weight:700;font-size:15px;line-height:1.3}
.slogan span{font-size:26px;line-height:1}
.cond{margin-top:12px}
.tot2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tot2 div{background:var(--surface2);border-radius:14px;padding:9px 11px;min-width:0}
.tot2 small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.tot2 b{display:block;font:700 14px var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tot2 i{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend s{display:inline-block;width:0;height:12px;border-left:2px dashed var(--ink);vertical-align:-2px;margin-right:5px;text-decoration:none}
.legend s.nx{border-left-color:var(--tot)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0;box-shadow:var(--sh)}
.kv small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.kv b{display:block;font:700 16px var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;margin-top:2px}
.ladder div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.ladder div:last-child{border:0;font-weight:700}
.ladder div.sub{font-weight:700;background:var(--soft);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:10px;border-bottom-color:transparent}
.ladder b{font:700 14px var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mini{font-size:13.5px;color:var(--muted)}
details>summary{cursor:pointer;font-weight:700;padding:10px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-family:var(--mono)}
details[open]>summary::after{content:"−"}
details.comp>summary.bbtn{background:var(--btn);color:var(--on-btn);border-radius:16px;min-height:50px;padding:0 16px;justify-content:center;gap:8px;font-size:15px}
details.comp>summary.bbtn::after{content:none}
details.comp>summary.bbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
details.comp>summary.bbtn svg{order:-1}
label.f,div.f{display:grid;gap:4px;font-size:12.5px;font-weight:650;color:var(--muted)}
input[type=text],input[type=search],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 12px;min-height:44px;font-size:16px;font-weight:500}
::placeholder{color:var(--muted);opacity:.65}
input.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.srch{position:relative}
.srch svg{position:absolute;left:13px;top:13px;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;pointer-events:none}
.srch input{padding-left:40px;border-radius:99px;background:var(--surface)}
.seg.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:99px;min-height:38px;font-weight:650;padding:5px 12px;font-size:14px}
.chips button{flex:0 0 auto}
.seg button[aria-pressed=true]{background:var(--btn);color:var(--on-btn);border-color:transparent}
.row{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:9px;margin-bottom:10px;box-shadow:var(--sh)}
.row.hit{background:var(--hit);border:2px solid var(--hit-bar);box-shadow:inset 7px 0 0 var(--hit-bar),var(--sh);color:var(--on-hit)}
.row.hit label.f,.row.hit div.f,.row.hit .mini{color:var(--on-hit)}
.row.part{background:var(--amber-bg);border:2px solid #d99a2b;box-shadow:inset 7px 0 0 #d99a2b,var(--sh)}
.row.part label.f,.row.part div.f,.row.part .mini{color:var(--ink)}
div.ro{min-height:44px;display:flex;align-items:center;justify-content:flex-end;padding:9px 12px;border:1px dashed var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);font:700 16px var(--mono);font-variant-numeric:tabular-nums}
.row .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .head input{flex:1}
.row .hr{display:flex;gap:6px;align-items:center}
.res{display:flex;justify-content:space-between;font-size:14px}
.res b{font:700 14px var(--mono)}
select.miss{border-color:var(--bad);background:var(--warn-bg)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.hero-d,.hero-m{border-radius:20px;padding:16px;display:grid;gap:8px}
.hero-d{background:var(--hero);color:#fff}
.hero-m{background:var(--mint);color:var(--ink)}

.hb{font:700 28px/1.15 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere}
.hl{font-size:13px;opacity:.85}
.hero-d .pg{background:rgba(255,255,255,.2)}.hero-d .pg i{background:#5ee6a0}
.hero-m .pg{background:rgba(255,255,255,.65)}
:root[data-theme=dark] .hero-m .pg,:root:not([data-theme=light]) .hero-m .pg{--x:0}
.ht{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.ht div{border-radius:14px;padding:8px 10px;min-width:0}
.hero-d .ht div{background:rgba(255,255,255,.1)}
.hero-m .ht div{background:rgba(255,255,255,.6)}
:root[data-theme=dark] .hero-m .ht div{background:rgba(255,255,255,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .hero-m .ht div{background:rgba(255,255,255,.08)}:root:not([data-theme=light]) .hero-m .pg{background:rgba(255,255,255,.15)}}
:root[data-theme=dark] .hero-m .pg{background:rgba(255,255,255,.15)}
.ht small{display:block;font-size:11.5px;opacity:.8;font-weight:600}
.ht b{display:block;font:700 14px var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 12px;box-shadow:var(--sh);min-width:0}
.kc small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}

.kc i{font-style:normal;font-size:12px;color:var(--muted)}
.pf{display:grid;gap:10px}
.pf .ph{display:flex;gap:12px;align-items:center}
.pf .av{width:54px;height:54px;font-size:22px;flex:none}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.inner{margin-top:6px;border-top:1px solid var(--line)}
.foot{text-align:center;font-size:12px;color:var(--muted);margin:18px 0 0}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;background:var(--surface);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:20}
.nav a{flex:1;display:grid;justify-items:center;align-content:center;gap:2px;padding:6px 2px;font-size:11.5px;text-decoration:none;color:var(--muted);min-height:54px;font-weight:650;border-radius:16px}

.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.tr i,.pg i{transition:width .25s}}
/* ===== v8 concept: bento + vòng tiến độ + thanh điều hướng nổi dạng kính ===== */
:root{--bg:#f5f4f0;--surface:#ffffff;--surface2:#efeee9;--ink:#12140f;--muted:#666a60;--line:#e6e4dc;--soft:#e3f1e6;--key:#12140f;--sh:none;--r:24px;--glow:#c8f169;--gold:#f2b632;--hero:#0e2a1b}

body{font-family:system-ui,-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;letter-spacing:-.01em;padding-block:10px 120px}
.top{padding:10px 0 14px;align-items:flex-end}

.acts{gap:8px}
.ib{box-shadow:none;border:1px solid var(--line);background:var(--surface)}

<script>
(function(){
'use strict';
var KEY='hanh-kpi-v2',BKEY='hanh-kpi-base',CKEY='hanh-kpi-sync',THEME='hanh-kpi-theme',PKEY='hanh-kpi-profile';
var KINDS=[['Thu kỳ',1,0.7],['Thu quá hạn',1.1,1.1]];
for(var i=0;i<10;i++)KINDS.push(['Thanh lý B'+(i+3),1.5,Math.round((1.30+0.02*i)*100)/100]);
KINDS.push(['Thanh lý COF',1.5,1.5]);
var B1=[[0,.15],[.5,.2],[.7,.25],[.8,.4],[1,.6],[1.1,.8],[1.2,1]];
var B2=[[0,.4],[.3,.5],[.6,.6],[.8,.7],[1,.8]];
var B3=[[0,0],[.8,.05],[.9,.075],[1,.105],[1.05,.115],[1.1,.1194],[1.15,.1268],[1.2,.1341],[1.25,.1425],[1.3,.155],[1.4,.1675],[1.5,.18]];
var TAX=[[0,.05],[10e6,.10],[30e6,.20],[60e6,.30],[100e6,.35]];
var HE=[0.05,0.10,0.15,0.20];
var NL='Ngoại lệ',CF=['n','k','cof','non','pe'],NF=['hd','n','pos','posThu','tien','mind','he'],SF=['tNON','tCOF','tNTU','ntuOK','dep'];
function uid(){return 'i'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function kindLabel(k){return k}

function sample(){var c=function(n,k,cof,non){return{id:uid(),row:null,n:n,k:k,cof:cof,non:non}};
  var t=function(hd,n,pos,posThu,he){return{id:uid(),row:null,hd:hd,n:n,pos:pos,posThu:posThu,tien:100000,mind:100000,he:he}};
  return{v:2,demo:true,month:'THÁNG 11',tNON:48535835,tCOF:31640242,tNTU:3,ntuOK:3,
  wC:.4,wN:.6,fixed:7100000,dep:2,bhxh:557550,notFull:.8,r85:.85,r80:.8,
  cust:[c('Nguyễn Phước Thiện Nhân','Thu kỳ',2500000,''),c('Hoàng Ngọc Tuân','Thu kỳ',3000000,''),c('Phạm Văn Đức','Thu kỳ',5000000,''),
    c('Khoản thanh lý B12 (mẫu)','Thanh lý B12','',30000000),c('Khoản thanh lý COF (mẫu)','Thanh lý COF',50000000,''),c('H Srep Knul','Thu kỳ','','')],
  ntu:[t('1500040025032383','Đinh Thị Tuyết Minh',5276758,5276758,.05),t('1500040024903147','Y Thiêl',5500000,5500000,.05),t('1500040024990870','Y Bình',7050000,7050000,.05),
    t('1500040025010405','Hoàng Thị Kép',9000000,9000000,.05),t('1500040024786377','Lê Thị Thương',9188049,9188049,.05),t('1500040025193532','Thị Lin',11300000,11300000,.05),
    t('1500040024802646','Tống Văn Đang',13750000,13750000,.20),t('1500040024821018','Lưu Thanh Tú',14824250,'',.10),t('1500040024821109','Phùng Nông Ba',29400000,29400000,.05)]};}
function blank(){var s=sample();s.demo=false;s.cust=[];s.ntu=[];s.ntuOK=0;s.tNTU=0;s.tNON=0;s.tCOF=0;s.dep=0;s.bhxh=557550;return s}

function rd(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function loadS(){var o=rd(KEY);if(o&&o.v===2){if(!o.bhxh)o.bhxh=557550;if(!o.mine)o.mine={};if(!o.mineN)o.mineN={};fixPos(o.ntu);return o}var d=sample();d.mine={};d.mineN={};return d}
var pf=Object.assign({name:'',role:'',code:'',branch:''},rd(PKEY)||{});
var S=loadS(),base=rd(BKEY),cfg=rd(CKEY)||{url:'',token:'',on:false,poll:12000};
var tmr;function save(){clearTimeout(tmr);tmr=setTimeout(function(){wr(KEY,S)},150)}

function num(x){var n=parseFloat(x);return isFinite(n)?n:0}
function has(x){return x!==''&&x!=null&&isFinite(parseFloat(x))}
function look(t,x){var v=t[0][1];for(var i=0;i<t.length;i++)if(x>=t[i][0])v=t[i][1];return v}
function tier(t,x){var k=0;for(var i=0;i<t.length;i++)if(x>=t[i][0])k=i;return k}
function kind(k){for(var i=0;i<KINDS.length;i++)if(KINDS[i][0]===k)return KINDS[i];return KINDS[0]}
function money(n){return Math.round(n).toLocaleString('vi-VN')+' đ'}
function grp(n){return n===''||n==null?'':Math.round(n).toLocaleString('vi-VN')}
function pct(x,d){return (x*100).toFixed(d==null?3:d).replace('.',',')+'%'}
function dec(x){return String(x).replace('.',',')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ntuSt(r){ /* none | low | ok | tl */
  var t=num(r.tien),p=num(r.pos);
  if(t<=0)return'none';
  if(p>0&&t>=p)return'tl';
  if(t>=num(r.mind))return'ok';
  return'low';
}
/* POS đã thu tự điền: có tiền thu >= mindue (Đạt mindue hoặc Thanh lý) thì bằng POS của hồ sơ, ngược lại để trống. Khớp công thức trạng thái bên Sheet. */
function fixPos(list){list.forEach(function(r){var st=ntuSt(r),w=(st==='ok'||st==='tl')?num(r.pos):'';if(String(r.posThu==null?'':r.posThu)!==String(w))r.posThu=w});return list}
function heff(c){
  var hc=has(c.hc)?num(c.hc):null,hn=has(c.hn)?num(c.hn):null;
  if(hc==null||hn==null){var pc=null,pn=null,a=num(c.cof),b=num(c.non);
    if(has(c.pe)){if(a>0&&!(b>0))pc=num(c.pe)/a;else if(b>0&&!(a>0))pn=num(c.pe)/b;else if(a>0&&b>0)pc=pn=num(c.pe)/(a+b)}
    if(hc==null)hc=pc!=null?pc:1;if(hn==null)hn=pn!=null?pn:1}
  return [Math.round(hc*10000)/10000,Math.round(hn*10000)/10000];
}
function posOf(c){
  if(c.k===NL){if(has(c.pe))return num(c.pe);var h=heff(c);return num(c.cof)*h[0]+num(c.non)*h[1]}
  var k=kind(c.k);return num(c.cof)*k[1]+num(c.non)*k[2];
}
function fixPe(c){
  if(c.k!==NL){c.pe='';return}
  var h=heff(c);c.hc=h[0];c.hn=h[1];c.pe=(has(c.cof)||has(c.non))?Math.round(num(c.cof)*h[0]+num(c.non)*h[1]):'';
}
function calc(s){
  var o={cof:0,non:0,pos:0},i;
  for(i=0;i<s.cust.length;i++){var c=s.cust[i];o.cof+=num(c.cof);o.non+=num(c.non);o.pos+=posOf(c)}
  o.nPos=0;o.nPosThu=0;o.nTien=0;o.nResp=0;o.miss=0;o.okN=0;
  for(i=0;i<s.ntu.length;i++){var r=s.ntu[i];o.nPos+=num(r.pos);o.nPosThu+=num(r.posThu);o.nTien+=num(r.tien);
    if(has(r.he))o.nResp+=num(r.tien)*num(r.he);else if(num(r.tien)>0)o.miss++;
    var st=ntuSt(r);if(st==='ok'||st==='tl')o.okN++}
  o.i85=o.nPos*s.r85;o.i80=o.i85*s.r80;
  o.j85=o.i85>0?o.nPosThu/o.i85:0;o.j80=o.i80>0?o.nPosThu/o.i80:0;
  o.pCof=s.tCOF>0?o.cof/s.tCOF:0;o.pNon=s.tNON>0?o.non/s.tNON:0;
  o.pTien=s.wC*o.pCof+s.wN*o.pNon;
  o.pNtu=s.tNTU>0?s.ntuOK/s.tNTU:0;
  o.kqNtu=o.pNtu*look(B1,o.pTien);o.kqTien=o.pTien*look(B2,o.pNtu);
  o.total=o.kqNtu+o.kqTien;o.rate=look(B3,o.total);
  o.full=o.j80>=1;o.resp=o.j85>=1;
  o.grossBonus=o.pos*o.rate;o.bonus=o.grossBonus*(o.full?1:s.notFull);
  o.respPay=o.resp?o.nResp:0;
  o.tong=o.bonus+s.fixed+o.respPay;
  o.ded=15.5e6+6.2e6*s.dep+s.bhxh;o.taxable=Math.max(0,o.tong-o.ded);
  o.tax=0;for(i=0;i<TAX.length;i++){var prev=i?TAX[i-1][1]:0;if(o.taxable>TAX[i][0])o.tax+=(o.taxable-TAX[i][0])*(TAX[i][1]-prev)}
  o.tax=Math.round(o.tax);o.thuc=o.tong-o.tax;
  var ni=tier(B3,o.total)+1;o.next=ni<B3.length?B3[ni]:null;
  return o;
}
function withExtra(s,cof,non,k,hc,hn){var c=JSON.parse(JSON.stringify(s));c.cust.push({id:'x',row:null,n:'',k:k||'Thu kỳ',cof:cof,non:non,hc:hc,hn:hn,pe:''});return c}
function need(s,key){
  var o=calc(s);if(!o.next)return null;var t=o.next[0];
  function f(x){return calc(withExtra(s,key==='cof'?x:0,key==='non'?x:0)).total}
  var hi=2e9;if(f(hi)<t)return null;var lo=0;
  for(var i=0;i<42;i++){var m=(lo+hi)/2;if(f(m)>=t)hi=m;else lo=m}
  return Math.ceil(hi/1000)*1000;
}

/* ---------- undo / redo ---------- */
var hist=[],redo=[],burst=false,bt;
function pre(force){
  if(force||!burst){hist.push(JSON.stringify(S));if(hist.length>80)hist.shift();redo=[]}
  burst=!force;clearTimeout(bt);bt=setTimeout(function(){burst=false},1000);updUndo();
}
function updUndo(){document.getElementById('undo').setAttribute('aria-disabled',hist.length?'false':'true');document.getElementById('redo').setAttribute('aria-disabled',redo.length?'false':'true')}
function doUndo(){if(!hist.length){toast('Không còn thao tác để hoàn tác');return}redo.push(JSON.stringify(S));S=JSON.parse(hist.pop());S.demo=false;burst=false;changed();render();toast('Đã hoàn tác');logEv('Hoàn tác một thao tác')}
function doRedo(){if(!redo.length){toast('Không có thao tác để làm lại');return}hist.push(JSON.stringify(S));S=JSON.parse(redo.pop());S.demo=false;burst=false;changed();render();toast('Đã làm lại');logEv('Làm lại một thao tác')}
function changed(){S.demo=false;fixPos(S.ntu);save();head();updUndo();schedSync(1200)}

/* ---------- sync (Google Sheet via Apps Script web app) ---------- */
var syncing=false,lastSync=0,dirtyRender=false,stt='idle',syncTimer;
function eq(a,b){return String(a==null?'':a)===String(b==null?'':b)}
function pick(o,F){var r={};F.forEach(function(f){r[f]=o[f]==null?'':o[f]});return r}
function kOf(l,x){return l==='ntu'&&x.hd?'h'+String(x.hd).trim():'r'+x.row}
function idxRows(l,list){var m={};list.forEach(function(x){if(x.row!=null||(l==='ntu'&&x.hd))m[kOf(l,x)]=x});return m}
function normR(d){return{s:pick(d.s||{},SF),month:d.month||'',cust:(d.cust||[]).map(function(x){var o=pick(x,CF);o.row=x.row;return o}),ntu:(d.ntu||[]).map(function(x){var o=pick(x,NF);o.row=x.row;return o})}}
function mergeList(bl,ll,rl,F,l){
  var B=idxRows(l,bl||[]),L=idxRows(l,ll),R=idxRows(l,rl),out=[];
  rl.forEach(function(r){var key=kOf(l,r),lo=L[key],b=B[key];
    if(!lo){if(b)return;var n=pick(r,F);n.id=uid();n.row=r.row;out.push(n);return}
    var o=Object.assign({},lo);o.row=r.row;if(b)F.forEach(function(f){if(eq(lo[f],b[f]))o[f]=r[f]==null?'':r[f]});out.push(o)});
  ll.forEach(function(lo){if(lo.row==null){out.push(lo);return}var key=kOf(l,lo);if(R[key])return;
    var b=B[key];if(!b||F.some(function(f){return !eq(lo[f],b[f])}))out.push(lo)});
  if(l==='ntu')out.sort(function(a,b){var d=num(a.pos)-num(b.pos);return d||(num(a.row)-num(b.row))});
  else out.sort(function(a,b){return (a.row==null?1e9:a.row)-(b.row==null?1e9:b.row)});
  return out;
}
function blankItem(m,list){return list==='cust'?(!m.n&&!has(m.cof)&&!has(m.non)):(!m.hd&&!m.n)}
function makePatches(R,M){
  var p=[];
  [['cust',CF],['ntu',NF]].forEach(function(x){var l=x[0],F=x[1],Rm=idxRows(l,R[l]),seen={};
    M[l].forEach(function(m){

  if(a==='del'&&row){var f=findItem(row);if(f){pre(true);var it=f[0][f[1]];if(row.dataset.l==='ntu'){logEv('Xóa hồ sơ NTU '+(it.n||it.hd));f[0].splice(f[1],1)}else if(it.row!=null&&!(S.mine&&S.mine[it.row])){logEv('Xóa số thu của '+(it.n||'(chưa tên)'));it.cof='';it.non=''}else{logEv('Xóa dòng '+(it.n||'(chưa tên)'));f[0].splice(f[1],1)}changed();render()}}
  else if(a==='addn'){
    var hd=String(nf.hd).replace(/\s/g,''),pos=num(String(nf.pos).replace(/\D/g,'')),mi=num(String(nf.mind).replace(/\D/g,''));
    if(!hd){toast('Nhập số HĐ');return}if(pos<=0){toast('Nhập POS');return}if(mi<=0){toast('Nhập mindue');return}
    if(S.ntu.some(function(x){return String(x.hd).trim()===hd})){toast('Số HĐ này đã có');return}
    pre(true);S.mineN=S.mineN||{};S.mineN[hd]=1;
    S.ntu.push({id:uid(),row:null,hd:hd,n:nf.n,pos:pos,posThu:'',tien:'',mind:mi,he:nf.he===''?'':parseFloat(nf.he)});logEv('Thêm hồ sơ NTU '+hd+(nf.n?' · '+nf.n:'')+' · POS '+grp(pos)+' · mindue '+grp(mi));
    nf={hd:'',n:'',pos:'',mind:'',he:''};ntuOpen=false;changed();render();toast('Đã thêm hồ sơ')}
  else if(a==='addc'){
    var amt=num(String(comp.amt).replace(/\D/g,''));if(amt<=0){toast('Nhập số tiền cần thêm');return}
    pre(true);var nm=String(comp.name).trim().toLowerCase(),tgt=null;
    if(nm)S.cust.forEach(function(c){if(!tgt&&String(c.n).trim().toLowerCase()===nm&&c.k===comp.k&&!has(c[comp.t==='COF'?'cof':'non']))tgt=c});
    if(!tgt){tgt={id:uid(),row:null,n:comp.name,k:comp.k,cof:'',non:''};S.cust.push(tgt)}
    logEv('Thêm '+grp(amt)+' '+comp.t+' · '+kindLabel(comp.k)+(comp.name?' · '+comp.name:'')+(tgt.row!=null?' (vào dòng có sẵn)':''));
    tgt[comp.t==='COF'?'cof':'non']=amt;if(comp.k===NL){tgt.hc=comp.hc;tgt.hn=comp.hn}fixPe(tgt);
    comp.amt='';comp.name='';compOpen=false;changed();render();toast('Đã thêm khoản thu')}
  else if(a==='sysave'){cfg={url:document.getElementById('sy-url').value.trim(),token:document.getElementById('sy-token').value.trim(),on:true,poll:12000};wr(CKEY,cfg);base=null;wr(BKEY,null);
    if(!cfg.url){toast('Nhập địa chỉ Web App');return}setStt('busy');sync().then(function(){toast(stt==='ok'?'Đã kết nối Google Sheet':'Chưa kết nối được: '+(sync.err||'kiểm tra lại'))})}
  else if(a==='syoff'){cfg.on=false;wr(CKEY,cfg);setStt('idle');toast('Đã ngắt đồng bộ')}
  else if(a==='cphd'&&row){var fi=findItem(row),hv=fi?String(fi[0][fi[1]].hd||''):'';if(!hv){toast('Hồ sơ chưa có số HĐ');return}
    var okc=function(){toast('Đã sao chép số HĐ '+hv)},nok=function(){toast('Số HĐ: '+hv)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(hv).then(okc,nok);else nok()}
  else if(a==='syncnow'){if(cfg.on&&cfg.url){setStt('busy');sync()}else toast('Chưa kết nối. Nhập địa chỉ Web App bên dưới.')}
  else if(a==='cp'){var tx=JSON.stringify(S);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(tx).then(function(){toast('Đã sao chép')},function(){document.getElementById('imp').value=tx;toast('Chọn và sao chép trong ô bên dưới')});else{document.getElementById('imp').value=tx;toast('Chọn và sao chép trong ô bên dưới')}}
  else if(a==='dl'){try{var u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),x=document.createElement('a');x.href=u;x.download='hanh-kpi-'+(S.month||'sao-luu').replace(/\s+/g,'-')+'.json';document.body.appendChild(x);x.click();x.remove();setTimeout(function(){URL.revokeObjectURL(u)},2000)}catch(er){toast('Không tải được, dùng Sao chép dữ liệu')}}
  else if(a==='imp')doImport(document.getElementById('imp').value);
  else if(a==='month')arm('bMonth','Nhấn lần nữa để xác nhận',function(){pre(true);S.cust.forEach(function(c){c.cof='';c.non=''});S.ntu.forEach(function(r){r.posThu='';r.tien='';r.he=''});S.ntuOK=0;logEv('Bắt đầu tháng mới (xóa số thu)');changed();render();toast('Đã bắt đầu tháng mới')});
  else if(a==='reset')arm('bReset','Nhấn lần nữa để xóa hết',function(){pre(true);S=blank();S.mine={};S.mineN={};if(cfg.on){base=null;wr(BKEY,null)}logEv('Xóa tất cả dữ liệu');changed();render();toast('Đã xóa dữ liệu')});
});
function afterEdit(){changed();
  if(cur==='tong-quan')viewTong();else if(cur==='thu-tien'){updThu();compPrev()}else if(cur==='ntu')updNtu()}
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.pf){pf[t.dataset.pf]=t.value;wr(PKEY,pf);head();return}
  if(t.id==='qn'){qNtu=t.value;document.getElementById('list').innerHTML=listNtu();updNtu();return}
  if(t.id==='q'){qCust=t.value;document.getElementById('list').innerHTML=listCust();updThu();return}
  if(t.id==='c-amt'){comp.amt=t.value.replace(/\D/g,'');compPrev();return}
  if(t.id==='c-name'){comp.name=t.value;return}
  if(t.id&&t.id.indexOf('n-')===0&&t.closest('#addNtu')){var key=t.id.slice(2);nf[key]=(key==='pos'||key==='mind')?t.value.replace(/\D/g,''):t.value;ntuOpen=true;return}
  if(t.id==='c-hc'||t.id==='c-hn'){comp[t.id==='c-hc'?'hc':'hn']=pnum(t.value);compPrev();var sg=document.querySelectorAll('.seg [data-ct]');if(sg.length===2){sg[0].textContent='COF · hệ số ×'+dec(comp.hc);sg[1].textContent='NON · hệ số ×'+dec(comp.hn)}return}
  if(t.dataset.set){pre(false);var k=t.dataset.set.replace('set-',''),v=t.value;
    if(k==='month')S.month=v;
    else{var n=num(String(v).replace(/\./g,'').replace(',','.'));if(['wC','wN','notFull','r85','r80'].indexOf(k)>=0)S[k]=n/100;else S[k]=n}
    afterEdit();return}
  var row=t.closest('.row');if(!row||!t.dataset.f)return;
  var f=findItem(row);if(!f)return;var r=f[0][f[1]],fl=t.dataset.f;
  pre(false);
  if(t.dataset.hs){r[fl]=pnum(t.value);fixPe(r)}
  else if(t.dataset.m){var d=t.value.replace(/\D/g,'');r[fl]=d===''?'':parseInt(d,10);if(r.k===NL)fixPe(r)}
  else if(fl==='he')r[fl]=t.value===''?'':parseFloat(t.value);
  else r[fl]=t.value;
  afterEdit();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='n-he'){nf.he=t.value;ntuOpen=true;return}
  if(t.id==='c-k'){comp.k=t.value;viewThu();return}
  if(t.tagName==='SELECT'&&t.dataset.f&&t.closest('.row')){var row=t.closest('.row'),f=findItem(row);if(!f)return;pre(true);var r=f[0][f[1]];
    r[t.dataset.f]=t.dataset.f==='he'?(t.value===''?'':parseFloat(t.value)):t.value;if(t.dataset.f==='k'){if(r.k===NL){r.pe='';r.hc=undefined;r.hn=undefined;fixPe(r)}else{r.pe='';delete r.hc;delete r.hn}}afterEdit();
    if(cur==='thu-tien'&&t.dataset.f==='k'){row.outerHTML=custRow(r);updThu()}}
});
document.addEventListener('focusout',function(e){
  var t=e.target;if(t.dataset&&t.dataset.m&&t.tagName==='INPUT'){var d=t.value.replace(/\D/g,'');t.value=d?parseInt(d,10).toLocaleString('vi-VN'):''}
  if(t.id==='n-pos'||t.id==='n-mind'){var d3=t.value.replace(/\D/g,'');t.value=d3?parseInt(d3,10).toLocaleString('vi-VN'):''}
  if(t.id==='c-amt'){var d2=t.value.replace(/\D/g,'');t.value=d2?parseInt(d2,10).toLocaleString('vi-VN'):''}
});

/* ---------- shell ---------- */
function render(){
  var nav=document.getElementById('nav');
  nav.innerHTML=TABS.map(function(t){return '<a href="#'+t[0]+'"'+(t[0]===cur?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+t[2]+'</svg>'+t[1]+'</a>'}).join('');
  if(cur==='tong-quan')viewTong();else if(cur==='thu-tien')viewThu();else if(cur==='ntu')viewNtu();else viewSet();
  updUndo();var fb=document.getElementById('fab');if(fb)fb.hidden=cur!=='thu-tien';
}
function route(){var h=(location.hash||'').slice(1);cur=TABS.some(function(t){return t[0]===h})?h:'tong-quan';render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);

applyTheme();head();route();bellN();document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!document.getElementById('histw').hidden)histClose()});
if(cfg.on&&cfg.url){setStt('busy');sync()}else setStt('idle');
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
window.__kpi={calc:calc,sample:sample,S:function(){return S},sync:sync,cfg:function(){return cfg},base:function(){return base}};
})();
