<style>
/* Layout: one column, scroll area + fixed bottom tab bar, built for one-hand use in the field.
   Color: calm green-tinted neutrals, deep teal accent, soft green for "collected" rows, strong ink for all text. */
:root{
  --bg:#f3f4f1;--surface:#ffffff;--surface2:#e6e9e3;--ink:#141c1a;--muted:#3d4845;--line:#c3cbc4;
  --accent:#07843f;--on-accent:#ffffff;--brand:#07843f;
  --cof:#2a78d6;--non:#d4561f;--ntu:#14906a;--tot:#4a3fb0;
  --good:#12622b;--good-bg:#d5ecd9;--info:#1a4fa3;--info-bg:#d9e5f7;--bad:#a3241d;--bad-bg:#f6dad7;
  --hit:#d9efe1;--hit-bar:#1f9a55;--on-hit:#10200f;--warn-bg:#fbe3df;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1514;--surface:#17201d;--surface2:#222d29;--ink:#eef3f0;--muted:#b6c3bd;--line:#34423d;
  --accent:#4cd68a;--on-accent:#04210f;--brand:#0b6a38;
  --cof:#5a9cf0;--non:#f08a5a;--ntu:#3dc49a;--tot:#a79df2;
  --good:#7fd69b;--good-bg:#1d3d2a;--info:#8fbaf5;--info-bg:#1c3050;--bad:#f59a93;--bad-bg:#472421;
  --hit:#1e4a2d;--hit-bar:#4cc36f;--on-hit:#eaf6ec;--warn-bg:#40231f;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514;--surface:#17201d;--surface2:#222d29;--ink:#eef3f0;--muted:#b6c3bd;--line:#34423d;
  --accent:#4cd68a;--on-accent:#04210f;--brand:#0b6a38;
  --cof:#5a9cf0;--non:#f08a5a;--ntu:#3dc49a;--tot:#a79df2;
  --good:#7fd69b;--good-bg:#1d3d2a;--info:#8fbaf5;--info-bg:#1c3050;--bad:#f59a93;--bad-bg:#472421;
  --hit:#1e4a2d;--hit-bar:#4cc36f;--on-hit:#eaf6ec;--warn-bg:#40231f;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));padding-block:16px 100px;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto}
.frame{position:fixed;inset:0;border:9px solid var(--brand);pointer-events:none;z-index:50}
h1,h2,h3{margin:0;font-weight:650;text-wrap:balance}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--brand);color:#fff;border-radius:14px}
.top .tt{flex:1;min-width:0;display:grid;gap:4px;justify-items:start}
.top h1{font-size:19px;line-height:1.2;color:#fff}
.top .ib{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.45);color:#fff}
.top .sy{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.45);color:#fff}
.top .sy i,.top .sy.busy i,.top .sy.off i{background:#fff}.top .sy.ok i{background:#9df0bd}.top .sy.err i{background:#ffb4ab}
.acts{display:flex;gap:8px}
#theme{margin-left:22px}
.ib{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--ink)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-disabled=true]{opacity:.35}
.sy{font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center;min-height:30px}
.sy i{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.sy.ok i{background:var(--hit-bar)}.sy.busy i{background:var(--info)}.sy.err i{background:var(--bad)}.sy.off i{background:#c98a00}
.chip{font-size:12px;letter-spacing:.03em;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap;font-weight:600}
.chip.demo{background:var(--info-bg);color:var(--info)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:44px;font-weight:550}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:650}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,.nav a:focus-visible,.ib:focus-visible,.sy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sec{margin:16px 0 0}
.sec>h2{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.banner{border-radius:12px;padding:13px 14px;font-weight:650;line-height:1.35}
.banner small{display:block;font-weight:500;margin-top:4px}
.banner.l2{background:var(--good-bg);color:var(--good)}
.banner.l1{background:var(--info-bg);color:var(--info)}
.banner.l0{background:var(--bad-bg);color:var(--bad)}
.hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero b{font:650 38px/1.1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pill{font-size:13px;font-weight:650;padding:3px 10px;border-radius:99px;background:var(--surface2)}
.bars{display:grid;gap:13px;margin-top:14px}
.bl{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px}
.bl b{font:650 14px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tr{position:relative;height:14px;background:var(--surface2);border-radius:4px}
.tr i{position:absolute;left:0;top:0;bottom:0;border-radius:4px 5px 5px 4px}
.tr u{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--ink);text-decoration:none;opacity:.7}
.tr u.nx{border-left-color:var(--tot);opacity:1}
.slogan{margin-top:12px;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--good-bg);color:var(--good);font-weight:700;font-size:15px;line-height:1.3}
.slogan span{font-size:26px;line-height:1}
.ts .banner{padding:9px 10px;font-size:13px}.ts .banner small{font-size:12px}
.ts .card{padding:10px}.ts .hero b{font-size:30px}.ts .pill{font-size:12px}
.ts .bars{gap:9px;margin-top:10px}.ts .bl{font-size:13px;margin-bottom:3px}.ts .bl b{font-size:13px}.ts .tr{height:11px}
.ts .mini,.ts .legend{font-size:12px}
.tot2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tot2 div{background:var(--surface2);border-radius:10px;padding:7px 9px;min-width:0}
.tot2 small{display:block;color:var(--muted);font-size:12px}
.tot2 b{display:block;font:650 14px var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tot2 i{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend s{display:inline-block;width:0;height:12px;border-left:2px dashed var(--ink);vertical-align:-2px;margin-right:5px;text-decoration:none}
.legend s.nx{border-left-color:var(--tot)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.kv small{display:block;color:var(--muted);font-size:13px}
.kv b{display:block;font:650 17px var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;margin-top:2px}
.kv.em{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.kv.em small{color:inherit}
.ladder div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.ladder div:last-child{border:0;font-weight:700}
.ladder b{font:650 14px var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mini{font-size:14px;color:var(--muted)}
details>summary{cursor:pointer;font-weight:650;padding:10px 0;list-style:none;display:flex;justify-content:space-between}
details>summary::after{content:"+";font-family:var(--mono)}
details[open]>summary::after{content:"−"}
label.f,div.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=search],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 10px;min-height:44px;font-size:16px;font-weight:500}
::placeholder{color:var(--muted);opacity:.65}
input.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.row{background:var(--surface);border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:10px;display:grid;gap:8px;margin-bottom:8px}
.row.hit{background:var(--hit);color:var(--on-hit);border-left-color:var(--hit-bar)}
.row.hit label.f,.row.hit div.f,.row.hit .mini{color:var(--on-hit)}
.row .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row .head{display:flex;gap:8px;align-items:center}
.row .head input{flex:1}
.stat{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.stat.ok{background:var(--hit-bar);color:#fff}
.stat.warn{background:var(--warn-bg);color:var(--bad)}
.res{display:flex;justify-content:space-between;font-size:14px}
.res b{font:650 14px var(--mono)}
div.ro{min-height:44px;display:flex;align-items:center;justify-content:flex-end;padding:9px 10px;border:1px dashed var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);font:650 16px var(--mono);font-variant-numeric:tabular-nums}
select.miss{border-color:var(--bad);background:var(--warn-bg)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:42px;font-weight:600;padding:6px 8px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.nav{position:fixed;left:9px;right:9px;bottom:9px;display:flex;background:var(--surface);border-top:1px solid var(--line);border-radius:12px 12px 4px 4px;padding:0 8px env(safe-area-inset-bottom,0px);z-index:20}
.nav a{flex:1;display:grid;justify-items:center;gap:2px;padding:8px 2px 7px;font-size:12px;text-decoration:none;color:var(--muted);min-height:58px;font-weight:600}
.nav a[aria-current=page]{color:var(--accent);font-weight:750}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.tr i{transition:width .25s}}
</style>
</head>
<body>




<div class="frame" aria-hidden="true"></div>
<div class="wrap">
  <div class="top">
    <div class="tt"><h1 id="month">KPI</h1><button class="sy" id="sy" type="button"><i></i><span id="syt">Chưa kết nối</span></button></div>

      <button class="ib" id="redo" type="button" aria-label="Làm lại"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    </div>
    <button class="ib" id="theme" type="button" aria-label="Đổi giao diện sáng hoặc tối"><svg viewBox="0 0 24 24" aria-hidden="true" id="theme-ico"></svg></button>
  </div>
  <main id="view"></main>
</div>
<nav class="nav" id="nav" aria-label="Điều hướng"></nav>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
var KEY='hanh-kpi-v2',BKEY='hanh-kpi-base',CKEY='hanh-kpi-sync',THEME='hanh-kpi-theme';
var KINDS=[['Thu kỳ',1,0.7],['Thu quá hạn',1.1,1.1]];
for(var i=0;i<10;i++)KINDS.push(['Thanh lý B'+(i+3),1.5,Math.round((1.30+0.02*i)*100)/100]);
KINDS.push(['Thanh lý COF',1.5,1.5]);
var B1=[[0,.15],[.5,.2],[.7,.25],[.8,.4],[1,.6],[1.1,.8],[1.2,1]];
var B2=[[0,.4],[.3,.5],[.6,.6],[.8,.7],[1,.8]];
var B3=[[0,0],[.8,.05],[.9,.075],[1,.105],[1.05,.115],[1.1,.1194],[1.15,.1268],[1.2,.1341],[1.25,.1425],[1.3,.155],[1.4,.1675],[1.5,.18]];
var TAX=[[0,.05],[10e6,.10],[30e6,.20],[60e6,.30],[100e6,.35]];
var HE=[0.05,0.10,0.15,0.20];
var NL='Ngoại lệ',CF=['n','k','cof','non','pe'],NF=['hd','n','pos','posThu','tien','mind','he'],SF=['tNON','tCOF','tNTU','ntuOK','dep'];
function uid(){return 'i'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function kindLabel(k){return k}

function sample(){var c=function(n,k,cof,non){return{id:uid(),row:null,n:n,k:k,cof:cof,non:non}};
  var t=function(hd,n,pos,posThu,he){return{id:uid(),row:null,hd:hd,n:n,pos:pos,posThu:posThu,tien:100000,mind:100000,he:he}};
  return{v:2,demo:true,month:'THÁNG 11',tNON:48535835,tCOF:31640242,tNTU:3,ntuOK:3,
  wC:.4,wN:.6,fixed:7100000,dep:2,bhxh:557550,notFull:.8,r85:.85,r80:.8,
  cust:[c('Nguyễn Phước Thiện Nhân','Thu kỳ',2500000,''),c('Hoàng Ngọc Tuân','Thu kỳ',3000000,''),c('Phạm Văn Đức','Thu kỳ',5000000,''),
    c('Khoản thanh lý B12 (mẫu)','Thanh lý B12','',30000000),c('Khoản thanh lý COF (mẫu)','Thanh lý COF',50000000,''),c('H Srep Knul','Thu kỳ','','')],
  ntu:[t('1500040025032383','Đinh Thị Tuyết Minh',5276758,5276758,.05),t('1500040024903147','Y Thiêl',5500000,5500000,.05),t('1500040024990870','Y Bình',7050000,7050000,.05),
    t('1500040025010405','Hoàng Thị Kép',9000000,9000000,.05),t('1500040024786377','Lê Thị Thương',9188049,9188049,.05),t('1500040025193532','Thị Lin',11300000,11300000,.05),
    t('1500040024802646','Tống Văn Đang',13750000,13750000,.20),t('1500040024821018','Lưu Thanh Tú',14824250,'',.10),t('1500040024821109','Phùng Nông Ba',29400000,29400000,.05)]};}
function blank(){var s=sample();s.demo=false;s.cust=[];s.ntu=[];s.ntuOK=0;s.tNTU=0;s.tNON=0;s.tCOF=0;s.dep=0;s.bhxh=557550;return s}

function rd(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function loadS(){var o=rd(KEY);if(o&&o.v===2){if(!o.bhxh)o.bhxh=557550;if(!o.mine)o.mine={};if(!o.mineN)o.mineN={};return o}var d=sample();d.mine={};d.mineN={};return d}
var S=loadS(),base=rd(BKEY),cfg=rd(CKEY)||{url:'',token:'',on:false,poll:12000};
var tmr;function save(){clearTimeout(tmr);tmr=setTimeout(function(){wr(KEY,S)},150)}

function num(x){var n=parseFloat(x);return isFinite(n)?n:0}
function has(x){return x!==''&&x!=null&&isFinite(parseFloat(x))}
function look(t,x){var v=t[0][1];for(var i=0;i<t.length;i++)if(x>=t[i][0])v=t[i][1];return v}
function tier(t,x){var k=0;for(var i=0;i<t.length;i++)if(x>=t[i][0])k=i;return k}
function kind(k){for(var i=0;i<KINDS.length;i++)if(KINDS[i][0]===k)return KINDS[i];return KINDS[0]}
function money(n){return Math.round(n).toLocaleString('vi-VN')+' đ'}
function grp(n){return n===''||n==null?'':Math.round(n).toLocaleString('vi-VN')}
function pct(x,d){return (x*100).toFixed(d==null?3:d).replace('.',',')+'%'}
function dec(x){return String(x).replace('.',',')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ntuSt(r){ /* none | low | ok | tl */
  var t=num(r.tien),p=num(r.pos);
  if(t<=0)return'none';
  if(p>0&&t>=p)return'tl';
  if(t>=num(r.mind))return'ok';
  return'low';
}
function heff(c){
  var hc=has(c.hc)?num(c.hc):null,hn=has(c.hn)?num(c.hn):null;
  if(hc==null||hn==null){var pc=null,pn=null,a=num(c.cof),b=num(c.non);
    if(has(c.pe)){if(a>0&&!(b>0))pc=num(c.pe)/a;else if(b>0&&!(a>0))pn=num(c.pe)/b;else if(a>0&&b>0)pc=pn=num(c.pe)/(a+b)}
    if(hc==null)hc=pc!=null?pc:1;if(hn==null)hn=pn!=null?pn:1}
  return [Math.round(hc*10000)/10000,Math.round(hn*10000)/10000];
}
function posOf(c){
  if(c.k===NL){if(has(c.pe))return num(c.pe);var h=heff(c);return num(c.cof)*h[0]+num(c.non)*h[1]}
  var k=kind(c.k);return num(c.cof)*k[1]+num(c.non)*k[2];
}
function fixPe(c){
  if(c.k!==NL){c.pe='';return}
  var h=heff(c);c.hc=h[0];c.hn=h[1];c.pe=(has(c.cof)||has(c.non))?Math.round(num(c.cof)*h[0]+num(c.non)*h[1]):'';
}
function calc(s){
  var o={cof:0,non:0,pos:0},i;
  for(i=0;i<s.cust.length;i++){var c=s.cust[i];o.cof+=num(c.cof);o.non+=num(c.non);o.pos+=posOf(c)}
  o.nPos=0;o.nPosThu=0;o.nTien=0;o.nResp=0;o.miss=0;o.okN=0;
  for(i=0;i<s.ntu.length;i++){var r=s.ntu[i];o.nPos+=num(r.pos);o.nPosThu+=num(r.posThu);o.nTien+=num(r.tien);
    if(has(r.he))o.nResp+=num(r.tien)*num(r.he);else if(num(r.tien)>0)o.miss++;
    var st=ntuSt(r);if(st==='ok'||st==='tl')o.okN++}
  o.i85=o.nPos*s.r85;o.i80=o.i85*s.r80;
  o.j85=o.i85>0?o.nPosThu/o.i85:0;o.j80=o.i80>0?o.nPosThu/o.i80:0;
  o.pCof=s.tCOF>0?o.cof/s.tCOF:0;o.pNon=s.tNON>0?o.non/s.tNON:0;
  o.pTien=s.wC*o.pCof+s.wN*o.pNon;
  o.pNtu=s.tNTU>0?s.ntuOK/s.tNTU:0;

function toast(t){var e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},2200)}
function doImport(txt){try{var o=JSON.parse(txt);if(!o||o.v!==2||!Array.isArray(o.cust)||!Array.isArray(o.ntu))throw 0;pre(true);S=o;S.demo=false;changed();render();toast('Đã khôi phục dữ liệu')}catch(e){toast('Dữ liệu không hợp lệ')}}
var armed={};
function arm(id,msg,fn){var b=document.getElementById(id);if(armed[id]){armed[id]=0;fn();return}armed[id]=1;var t=b.textContent;b.textContent=msg;setTimeout(function(){armed[id]=0;if(b.isConnected)b.textContent=t},3000)}
function head(){document.getElementById('month').textContent=S.month||'KPI'}
function findItem(row){var l=S[row.dataset.l];for(var i=0;i<l.length;i++)if(l[i].id===row.dataset.id)return[l,i];return null}

document.addEventListener('click',function(e){
  var t=e.target,b=t.closest('[data-act]');
  if(t.closest('#theme')){wr(THEME,isDark()?'light':'dark');applyTheme();if(cur==='cai-dat')viewSet();return}if(t.closest('#undo')){doUndo();return}if(t.closest('#redo')){doRedo();return}
  if(t.closest('#sy')){if(cfg.on&&cfg.url)sync();else location.hash='#cai-dat';return}
  var seg=t.closest('[data-ct],[data-fc],[data-fn],[data-th]');
  if(seg){
    if(seg.dataset.ct){comp.t=seg.dataset.ct;viewThu();document.getElementById('c-amt').focus()}
    else if(seg.dataset.fc){fCust=seg.dataset.fc;viewThu()}
    else if(seg.dataset.fn){fNtu=seg.dataset.fn;viewNtu()}
    else{wr(THEME,seg.dataset.th);applyTheme();viewSet()}
    return}
  if(!b)return;var a=b.dataset.act,row=b.closest('.row');
  if(a==='del'&&row){var f=findItem(row);if(f){pre(true);var it=f[0][f[1]];if(row.dataset.l==='ntu'){f[0].splice(f[1],1)}else if(it.row!=null&&!(S.mine&&S.mine[it.row])){it.cof='';it.non=''}else f[0].splice(f[1],1);changed();render()}}
  else if(a==='addn'){
    var hd=String(nf.hd).replace(/\s/g,''),pos=num(String(nf.pos).replace(/\D/g,'')),mi=num(String(nf.mind).replace(/\D/g,''));
    if(!hd){toast('Nhập số HĐ');return}if(pos<=0){toast('Nhập POS');return}if(mi<=0){toast('Nhập mindue');return}
    if(S.ntu.some(function(x){return String(x.hd).trim()===hd})){toast('Số HĐ này đã có');return}
    pre(true);S.mineN=S.mineN||{};S.mineN[hd]=1;
    S.ntu.push({id:uid(),row:null,hd:hd,n:nf.n,pos:pos,posThu:'',tien:'',mind:mi,he:nf.he===''?'':parseFloat(nf.he)});
    nf={hd:'',n:'',pos:'',mind:'',he:''};ntuOpen=false;changed();render();toast('Đã thêm hồ sơ')}
  else if(a==='addc'){
    var amt=num(String(comp.amt).replace(/\D/g,''));if(amt<=0){toast('Nhập số tiền cần thêm');return}
    pre(true);var nm=String(comp.name).trim().toLowerCase(),tgt=null;
    if(nm)S.cust.forEach(function(c){if(!tgt&&String(c.n).trim().toLowerCase()===nm&&c.k===comp.k&&!has(c[comp.t==='COF'?'cof':'non']))tgt=c});
    if(!tgt){tgt={id:uid(),row:null,n:comp.name,k:comp.k,cof:'',non:''};S.cust.push(tgt)}
    tgt[comp.t==='COF'?'cof':'non']=amt;if(comp.k===NL){tgt.hc=comp.hc;tgt.hn=comp.hn}fixPe(tgt);
    comp.amt='';comp.name='';changed();render();toast('Đã thêm khoản thu')}
  else if(a==='sysave'){cfg={url:document.getElementById('sy-url').value.trim(),token:document.getElementById('sy-token').value.trim(),on:true,poll:12000};wr(CKEY,cfg);base=null;wr(BKEY,null);
    if(!cfg.url){toast('Nhập địa chỉ Web App');return}setStt('busy');sync().then(function(){toast(stt==='ok'?'Đã kết nối Google Sheet':'Chưa kết nối được: '+(sync.err||'kiểm tra lại'))})}
  else if(a==='syoff'){cfg.on=false;wr(CKEY,cfg);setStt('idle');toast('Đã ngắt đồng bộ')}
  else if(a==='cp'){var tx=JSON.stringify(S);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(tx).then(function(){toast('Đã sao chép')},function(){document.getElementById('imp').value=tx;toast('Chọn và sao chép trong ô bên dưới')});else{document.getElementById('imp').value=tx;toast('Chọn và sao chép trong ô bên dưới')}}
  else if(a==='dl'){try{var u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),x=document.createElement('a');x.href=u;x.download='hanh-kpi-'+(S.month||'sao-luu').replace(/\s+/g,'-')+'.json';document.body.appendChild(x);x.click();x.remove();setTimeout(function(){URL.revokeObjectURL(u)},2000)}catch(er){toast('Không tải được, dùng Sao chép dữ liệu')}}
  else if(a==='imp')doImport(document.getElementById('imp').value);
  else if(a==='month')arm('bMonth','Nhấn lần nữa để xác nhận',function(){pre(true);S.cust.forEach(function(c){c.cof='';c.non=''});S.ntu.forEach(function(r){r.posThu='';r.tien='';r.he=''});S.ntuOK=0;changed();render();toast('Đã bắt đầu tháng mới')});
  else if(a==='reset')arm('bReset','Nhấn lần nữa để xóa hết',function(){pre(true);S=blank();S.mine={};S.mineN={};if(cfg.on){base=null;wr(BKEY,null)}changed();render();toast('Đã xóa dữ liệu')});
});

  else if(t.dataset.m){var d=t.value.replace(/\D/g,'');r[fl]=d===''?'':parseInt(d,10);if(r.k===NL)fixPe(r)}
  else if(fl==='he')r[fl]=t.value===''?'':parseFloat(t.value);
  else r[fl]=t.value;
  afterEdit();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='n-he'){nf.he=t.value;ntuOpen=true;return}
  if(t.id==='c-k'){comp.k=t.value;viewThu();return}
  if(t.tagName==='SELECT'&&t.dataset.f&&t.closest('.row')){var row=t.closest('.row'),f=findItem(row);if(!f)return;pre(true);var r=f[0][f[1]];
    r[t.dataset.f]=t.dataset.f==='he'?(t.value===''?'':parseFloat(t.value)):t.value;if(t.dataset.f==='k'){if(r.k===NL){r.pe='';r.hc=undefined;r.hn=undefined;fixPe(r)}else{r.pe='';delete r.hc;delete r.hn}}afterEdit();
    if(cur==='thu-tien'&&t.dataset.f==='k'){row.outerHTML=custRow(r);updThu()}}
});
document.addEventListener('focusout',function(e){
  var t=e.target;if(t.dataset&&t.dataset.m&&t.tagName==='INPUT'){var d=t.value.replace(/\D/g,'');t.value=d?parseInt(d,10).toLocaleString('vi-VN'):''}
  if(t.id==='n-pos'||t.id==='n-mind'){var d3=t.value.replace(/\D/g,'');t.value=d3?parseInt(d3,10).toLocaleString('vi-VN'):''}
  if(t.id==='c-amt'){var d2=t.value.replace(/\D/g,'');t.value=d2?parseInt(d2,10).toLocaleString('vi-VN'):''}
});

function render(){
  var nav=document.getElementById('nav');
  nav.innerHTML=TABS.map(function(t){return '<a href="#'+t[0]+'"'+(t[0]===cur?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+t[2]+'</svg>'+t[1]+'</a>'}).join('');
  if(cur==='tong-quan')viewTong();else if(cur==='thu-tien')viewThu();else if(cur==='ntu')viewNtu();else viewSet();
  updUndo();
}
function route(){var h=(location.hash||'').slice(1);cur=TABS.some(function(t){return t[0]===h})?h:'tong-quan';render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);

function applyTheme(){var m=rd(THEME)||'auto',r=document.documentElement;if(m==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',m);themeIco()}
